name: Deploy repository to Github Pages

on:
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'plugins/**'
      - '.gitmodules'
      - 'build_site.sh'
      - 'update_plugins.sh'
      - '.github/workflows/deploy.yml'
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: plugin-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: '0'
        submodules: recursive
    - name: Update plugins from their tracked branches
      run: ./update_plugins.sh --commit
    - name: Build plugin source
      run: |
        chmod +x build_site.sh
        ./build_site.sh _site/${{ github.ref_name }}
    - uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}main/index.yml
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
